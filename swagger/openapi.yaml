# ===== swagger/openapi.yaml =====

openapi: 3.0.3
info:
  title: Task Manager API
  description: |
    Production-grade REST API with JWT Authentication, Role-Based Access Control,
    and full CRUD operations for Task management.

    ## Authentication
    - Register or login to receive an **access token**
    - Pass the token in the `Authorization` header as `Bearer <token>`
    - Access tokens expire in **15 minutes**
    - Use `POST /auth/refresh` to get a new access token via httpOnly cookie

    ## Roles
    - **USER** — Can manage only their own tasks
    - **ADMIN** — Can manage all tasks across all users
  version: 1.0.0
  contact:
    name: Gurrala Sai Haneesh
    email: joydip@primetrade.ai

servers:
  - url: http://localhost:5000/api/v1
    description: Local development server

tags:
  - name: Health
    description: API health check
  - name: Auth
    description: Authentication and user management
  - name: Tasks
    description: Task CRUD operations

# ─────────────────────────────────────────────
# Security scheme
# ─────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ── Success Response Envelope ──────────────
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation successful.
        data:
          type: object

    # ── Error Response Envelope ────────────────
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: An error occurred.
        errorCode:
          type: string
          example: VALIDATION_ERROR
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    # ── User ───────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 90f87fda-bb3a-4395-a398-e831553f694c
        email:
          type: string
          format: email
          example: user@example.com
        role:
          type: string
          enum: [USER, ADMIN]
          example: USER
        createdAt:
          type: string
          format: date-time
          example: "2026-02-26T14:56:38.133Z"

    # ── Task ───────────────────────────────────
    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: e8d30090-fbf8-474c-9577-880a1906b241
        title:
          type: string
          example: Build REST API
        description:
          type: string
          nullable: true
          example: Implement JWT authentication and RBAC
        status:
          type: string
          enum: [PENDING, IN_PROGRESS, COMPLETED]
          example: PENDING
        userId:
          type: string
          format: uuid
          example: 90f87fda-bb3a-4395-a398-e831553f694c
        createdAt:
          type: string
          format: date-time
          example: "2026-02-26T15:10:35.634Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-02-26T15:16:03.864Z"
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email

    # ── Pagination Meta ─────────────────────────
    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
          example: 25
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        totalPages:
          type: integer
          example: 3
        hasNextPage:
          type: boolean
          example: true
        hasPrevPage:
          type: boolean
          example: false

# ─────────────────────────────────────────────
# Paths
# ─────────────────────────────────────────────
paths:

  # ── Health ────────────────────────────────────
  /health:
    get:
      tags: [Health]
      summary: API health check
      description: Lightweight endpoint for uptime monitoring. Does not touch the database.
      responses:
        "200":
          description: API is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: API is running.
                  environment:
                    type: string
                    example: development
                  timestamp:
                    type: string
                    format: date-time
                  version:
                    type: string
                    example: v1

  # ── Auth ──────────────────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: Creates a new USER account. Returns access token and sets httpOnly refresh token cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, confirmPassword]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  minLength: 8
                  example: Test@1234
                  description: Must contain uppercase, lowercase, number, and special character
                confirmPassword:
                  type: string
                  example: Test@1234
      responses:
        "201":
          description: Account created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/User'
                          accessToken:
                            type: string
                            example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      description: Authenticates user and returns access token. Sets httpOnly refresh token cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  example: Test@1234
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/User'
                          accessToken:
                            type: string
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      description: Issues a new access token using the httpOnly refresh token cookie.
      responses:
        "200":
          description: Access token refreshed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken:
                            type: string
        "401":
          description: No refresh token or token expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout current user
      description: Clears the httpOnly refresh token cookie.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user profile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Profile retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/User'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change user password
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword, confirmNewPassword]
              properties:
                currentPassword:
                  type: string
                  example: Test@1234
                newPassword:
                  type: string
                  example: NewPass@5678
                confirmNewPassword:
                  type: string
                  example: NewPass@5678
      responses:
        "200":
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        "401":
          description: Current password incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── Tasks ─────────────────────────────────────
  /tasks:
    post:
      tags: [Tasks]
      summary: Create a new task
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  minLength: 3
                  maxLength: 255
                  example: Implement JWT authentication
                description:
                  type: string
                  maxLength: 2000
                  example: Add bcrypt password hashing and JWT token generation
                status:
                  type: string
                  enum: [PENDING, IN_PROGRESS, COMPLETED]
                  default: PENDING
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          task:
                            $ref: '#/components/schemas/Task'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags: [Tasks]
      summary: Get all tasks
      description: |
        USER role returns only their own tasks.
        ADMIN role returns all tasks across all users.
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, IN_PROGRESS, COMPLETED]
          description: Filter by task status
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 100
          description: Results per page
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [createdAt, updatedAt, title, status]
            default: createdAt
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: search
          in: query
          schema:
            type: string
          description: Search in title and description
      responses:
        "200":
          description: Tasks retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      tasks:
                        type: array
                        items:
                          $ref: '#/components/schemas/Task'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /tasks/stats:
    get:
      tags: [Tasks]
      summary: Get task statistics (Admin only)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Statistics retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          stats:
                            type: object
                            properties:
                              total:
                                type: integer
                                example: 42
                              statusBreakdown:
                                type: object
                                example:
                                  PENDING: 20
                                  IN_PROGRESS: 12
                                  COMPLETED: 10
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tasks/{id}:
    get:
      tags: [Tasks]
      summary: Get a task by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: e8d30090-fbf8-474c-9577-880a1906b241
      responses:
        "200":
          description: Task retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          task:
                            $ref: '#/components/schemas/Task'
        "403":
          description: Not resource owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [Tasks]
      summary: Update a task by ID
      description: Partial update — only include fields you want to change.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title:
                  type: string
                  minLength: 3
                  maxLength: 255
                  example: Updated task title
                description:
                  type: string
                  maxLength: 2000
                status:
                  type: string
                  enum: [PENDING, IN_PROGRESS, COMPLETED]
                  example: IN_PROGRESS
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          task:
                            $ref: '#/components/schemas/Task'
        "403":
          description: Not resource owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Tasks]
      summary: Delete a task by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Task deleted successfully (no content)
        "403":
          description: Not resource owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
